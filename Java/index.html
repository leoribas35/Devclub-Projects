<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital@0;1&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;1,700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./scripts.js"></script>
    <title>Devclub - Convert Money</title>
</head>
<body>
    <img class="logo" src="./logo 1.png" alt="logo-devclub-convert-money">
    <main>
        <label>
            Converter <b> de

            </b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>
        <label>
            Converter <b>para</b>
            <select class="currency-select">
                <option value="dolar">U$$ Dólar Americano</option>
                <option value="euro">€ Euro</option>
            </select>
        </label>
        <label>
            Valor
            <input class="input-currency" placeholder="R$10.000,00">
        
        </label>
        <button class="convert-button" id="convert-button">Converter</button>
        <section>
            <div class="currency">
                <img src="./brasil 2.png" alt="logo-moeda-a-converter">
                <p class="currency">Real</p>
                <p class="currency-value-to-convert">R$ 0,00</p>
            </div>
            <img class="arrow" src="./Vector.png" alt="seta">

            <div class="currency">
                <img src="./estados-unidos (1) 1.png" alt="logo-moeda-convertida">
                <p class="currency">Dólar</p>
                <p class="currency-value">U$$ 0,00</p>
            </div>
        </section>
    </main>

</body>
</html>
