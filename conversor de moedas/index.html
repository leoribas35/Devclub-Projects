            <!DOCTYPE html>
            <html lang="pt-br">

            <head>
                <meta charset="UTF-8">
                <meta name="viewport" content="width=device-width, initial-scale=1.0">

                <link rel="preconnect" href="https://fonts.googleapis.com">
                <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

                <link
                    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Roboto:wght@100..900&display=swap"
                    rel="stylesheet"
                >

                <link rel="stylesheet" href="./style.css">

                <script src="./scripts.js" defer></script>

                <title>Devclub - Convert Money</title>
            </head>

            <body>

                <img
                    class="logo"
                    src="./logo.png"
                    alt="Logo Devclub Convert Money"
                >

                <main>

                    <label>
                        Converter de

                        <select class="origin-select">
                            <option value="BRL">R$ Real Brasileiro</option>
                            <option value="USD">US$ Dólar Americano</option>
                            <option value="EUR">€ Euro</option>
                            <option value="GBP">£ Libra</option>
                            <option value="BTC">₿ Bitcoin</option>
                        </select>
                    </label>

                    <label>
                        Converter para

                        <select class="currency-select">
                            <option value="USD">US$ Dólar Americano</option>
                            <option value="BRL">R$ Real Brasileiro</option>
                            <option value="EUR">€ Euro</option>
                            <option value="GBP">£ Libra</option>
                            <option value="BTC">₿ Bitcoin</option>
                        </select>
                    </label>

                    <label>
                        Valor

                        <input
                            class="input-currency"
                            placeholder="10000.00"
                            type="number"
                            min="0"
                            step="any"
                        >
                    </label>

                    <button
                        class="convert-button"
                        type="button"
                    >
                        Converter
                    </button>

                    <section>

                        <div class="currency-box">

                            <img
                                class="origin-flag"
                                src="./brasil.png"
                                alt="Bandeira da moeda de origem"
                            >

                            <p class="currency origin-name">
                                Real
                            </p>

                            <p class="currency-value-to-convert">
                                R$ 0,00
                            </p>

                        </div>

                        <img
                            class="arrow"
                            src="./Vector.png"
                            alt="Seta"
                        >

                        <div class="currency-box">

                            <img
                                class="currency-flag"
                                src="./estados-unidos.png"
                                alt="Bandeira da moeda de destino"
                            >

                            <p class="currency currency-name">
                                Dólar
                            </p>

                            <p class="currency-value">
                                US$ 0,00
                            </p>

                        </div>
                
                        
                    </section>      



                </main>

            </body>

            </html>
